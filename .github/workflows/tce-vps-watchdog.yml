name: TCE VPS Watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tce-vps-watchdog.yml"
      - "start.mjs"
      - "src/app/health/route.ts"
      - "src/app/api/internal/tce/**"
      - "src/app/api/internal/cmi/**"
      - "src/server/agents/tce-orchestrator.ts"
      - "src/server/channels/channel-policy.ts"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  production-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Probe current production and infrastructure diagnostics
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          HOST="app.tamcocexperience.com"
          CURRENT_PROD_IP="187.77.158.111"
          OVH_MIGRATION_IP="57.128.186.45"
          URL="https://${HOST}/health"
          rm -f /tmp/health.json /tmp/http_code /tmp/coolify_port /tmp/ovh_http_code

          if timeout 6 bash -c "</dev/tcp/${CURRENT_PROD_IP}/8000" 2>/dev/null; then
            echo "OPEN" > /tmp/coolify_port
          else
            echo "UNREACHABLE" > /tmp/coolify_port
          fi

          ovh_code="$(curl -sS --max-time 12 --resolve "${HOST}:443:${OVH_MIGRATION_IP}" -o /tmp/ovh-health.json -w '%{http_code}' "$URL" || true)"
          echo "$ovh_code" > /tmp/ovh_http_code

          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sS --connect-timeout 8 --max-time 20 -o /tmp/health.json -w '%{http_code}' "$URL" || true)"
            echo "$code" > /tmp/http_code
            if [ "$code" = "200" ] && python3 -m json.tool /tmp/health.json >/dev/null 2>&1; then
              echo "Current production reachable on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt: current production ${CURRENT_PROD_IP} not ready, HTTP ${code:-000}"
            if [ "$attempt" -lt 6 ]; then sleep 12; fi
          done

          echo "Current production /health failed. Coolify port 8000=$(cat /tmp/coolify_port); OVH migration target HTTP=$(cat /tmp/ovh_http_code)."
          exit 1

      - name: Validate autonomous-company invariants
        shell: python
        run: |
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/health.json").read_text())
          errors = []

          def expect(cond, message):
              if not cond:
                  errors.append(message)

          expect(data.get("status") == "ok", f"status={data.get('status')!r}, expected 'ok'")
          checks = data.get("checks") or {}
          expect(checks.get("app") == "ok", f"checks.app={checks.get('app')!r}")
          expect(checks.get("database") == "ok", f"checks.database={checks.get('database')!r}")
          expect(int(data.get("agentRegistry") or 0) >= 16, f"agentRegistry={data.get('agentRegistry')!r}, expected >=16")
          expect(int(data.get("executiveOrgRoles") or 0) >= 11, f"executiveOrgRoles={data.get('executiveOrgRoles')!r}, expected >=11")

          features = data.get("features") or {}
          expect(features.get("companyAutopilot") == "v1",
                 f"companyAutopilot={features.get('companyAutopilot')!r}, expected v1")
          expect(features.get("phase14Sprint") == "2026-09-21-v1",
                 f"phase14Sprint={features.get('phase14Sprint')!r}, expected 2026-09-21-v1")
          expect(features.get("cmoExecutiveOperatingSystem") == "v2",
                 f"cmoExecutiveOperatingSystem={features.get('cmoExecutiveOperatingSystem')!r}")
          expect(features.get("ccoClosedLoop") == "v1",
                 f"ccoClosedLoop={features.get('ccoClosedLoop')!r}")
          expect(features.get("businessOperatingPlan") == "2026-2027-v1",
                 f"businessOperatingPlan={features.get('businessOperatingPlan')!r}")

          signals = data.get("runtimeSignals") or {}
          expect(signals.get("companyAutopilotEnabled") is True,
                 f"companyAutopilotEnabled={signals.get('companyAutopilotEnabled')!r}")
          expect(signals.get("companyRuntimeMode") == "VPS_ALWAYS_ON",
                 f"companyRuntimeMode={signals.get('companyRuntimeMode')!r}")
          expect(signals.get("desktopDependency") is False,
                 f"desktopDependency={signals.get('desktopDependency')!r}")
          expect(signals.get("executiveWorkerEnabled") is True,
                 f"executiveWorkerEnabled={signals.get('executiveWorkerEnabled')!r}")
          expect(signals.get("syncWorkerEnabled") is True,
                 f"syncWorkerEnabled={signals.get('syncWorkerEnabled')!r}")
          expect(signals.get("staffOpsWorkerEnabled") is True,
                 f"staffOpsWorkerEnabled={signals.get('staffOpsWorkerEnabled')!r}")
          expect(signals.get("cmiBrowserEnabled") is True,
                 f"cmiBrowserEnabled={signals.get('cmiBrowserEnabled')!r}")
          expect(signals.get("cmiQueueWorkerEnabled") is True,
                 f"cmiQueueWorkerEnabled={signals.get('cmiQueueWorkerEnabled')!r}")
          expect(signals.get("nonFacebookOpenChannelCount") == 0,
                 f"nonFacebookOpenChannelCount={signals.get('nonFacebookOpenChannelCount')!r}")
          expect(signals.get("kiotVietWriteEnabled") is False,
                 f"kiotVietWriteEnabled={signals.get('kiotVietWriteEnabled')!r}")
          expect(signals.get("directBookingAutoCreateEnabled") is False,
                 f"directBookingAutoCreateEnabled={signals.get('directBookingAutoCreateEnabled')!r}")
          expect(signals.get("businessOperatingPlanStatus") == "ACTIVE_OPERATING_PLAN",
                 f"businessOperatingPlanStatus={signals.get('businessOperatingPlanStatus')!r}")
          expect(signals.get("businessOperatingPlanDecisionId") == "DEC-TCE-BPLAN-20260920-001",
                 f"businessOperatingPlanDecisionId={signals.get('businessOperatingPlanDecisionId')!r}")

          open_channels = signals.get("openCustomerChannels") or []
          expect(open_channels == ["facebook"],
                 f"openCustomerChannels={open_channels!r}, expected ['facebook']")

          knowledge = data.get("knowledgeRuntime") or {}
          if knowledge:
              expect(knowledge.get("errorSources") == 0,
                     f"knowledgeRuntime.errorSources={knowledge.get('errorSources')!r}")
              expected = knowledge.get("expectedSources")
              synced = knowledge.get("syncedSources")
              if expected is not None and synced is not None:
                  expect(synced >= expected,
                         f"knowledgeRuntime.syncedSources={synced!r} < expectedSources={expected!r}")

          if errors:
              print("WATCHDOG FAIL")
              for item in errors:
                  print(f"- {item}")
              raise SystemExit(1)

          print("WATCHDOG PASS")
          print("runtime_mode=VPS_ALWAYS_ON")
          print(f"runtime={data.get('runtime')}")
          print(f"agentRegistry={data.get('agentRegistry')}")
          print(f"executiveOrgRoles={data.get('executiveOrgRoles')}")
          print(f"openCustomerChannels={open_channels}")
          print("desktop_dependency=false")
          print("guardrails=PASS")

      - name: Write sanitized summary
        if: always()
        shell: bash
        run: |
          {
            echo "## TCE VPS Autopilot Watchdog"
            echo
            echo "- Checked: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Current production authority: app.tamcocexperience.com -> 187.77.158.111"
            echo "- OVH migration target: 57.128.186.45 (diagnostic only until cutover acceptance)"
            echo "- Job status: ${{ job.status }}"
            if [ -f /tmp/http_code ]; then echo "- Current production /health HTTP: $(cat /tmp/http_code)"; fi
            if [ -f /tmp/coolify_port ]; then echo "- Coolify control-plane port 8000: $(cat /tmp/coolify_port)"; fi
            if [ -f /tmp/ovh_http_code ]; then echo "- OVH migration-target /health HTTP: $(cat /tmp/ovh_http_code)"; fi
            echo "- Mac/Windows is not part of the monitoring authority."
            echo "- No secrets are read or printed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
