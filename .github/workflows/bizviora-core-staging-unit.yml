name: BIZVIORA Core staging unit security
on:
  push:
    branches:
      - feature/bizviora-core-mvp-001-20261010
      - review/bizviora-phase1-approval-e2e-20261014
    paths:
      - 'bizviora/core/**'
      - '.github/workflows/bizviora-core-staging-unit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bizviora/core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax validation
        run: |
          node --check server.mjs
          node --check src/access.mjs
          node --check src/api.mjs
          node --check src/founder-auth.mjs
          node --check src/founder-adapter.mjs
          node --check src/hosting-config.mjs
          node --check tests/api.test.mjs
          node --check tests/sql-contract.test.mjs
          node --check tests/hosting-config.test.mjs
          node --check tests/access-boundary.test.mjs
          node --check tests/api-security-regression.test.mjs
          node --check tests/founder-auth.test.mjs
      - name: Synthetic-only complete Core regression suite
        run: node --test tests/*.test.mjs
