function act(action,el){if(action==='close-modal'){document.getElementById('portal').innerHTML='';return}if(action==='reset-tenant'){S.tenantQ='';S.tenantIndustry='all';S.tenantState='all';S.tenantPlan='all';S.tenantHealth='all';reconcileTenantSelection();render();return}if(action==='reset-task'){S.taskQ='';S.taskStage='all';S.taskOwner='all';render();return}if(action==='deploy-board'||action==='deploy-table'){S.deployView=action==='deploy-board'?'board':'table';render();return}if(action==='deploy-update'){const val=+(document.getElementById('deployStage')?.value||0);onboarding[S.selectedDeploy].stage=val;render();toast('Đã đổi trạng thái onboarding trong dữ liệu DEMO');return}if(action==='save-note'){const tenant=tenants[S.selectedTenant];if(!tenant){toast('Không có tenant hợp lệ để lưu ghi chú');return}S.notesByTenant[tenant.id]=document.getElementById('tenant-note')?.value||'';toast('Đã lưu ghi chú riêng cho '+tenant.id+' trong RAM DEMO');return}if(action==='module-create'||action==='new-tenant'||action==='new-task'){announce('Tạo mới / gửi thay đổi');return}if(action==='approval-info'){modal('Quy tắc L2/L3',`L2/L3 phải có quyền server-side, bằng chứng, xác nhận, audit và rollback. Không có lệnh thực thi trên prototype.`);return}if(action==='make-report'){S.reportReady=true;render();toast('Đã tạo bản xem trước báo cáo DEMO');return}if(action==='download-report'){const items=[['DỮ LIỆU MẪU — KHÔNG SỬ DỤNG KẾ TOÁN','Giá trị'],['Tenant mẫu',tenants.length],['Module mẫu',modules.length],['Ngày','10/10/2026']];const csv=items.map(a=>a.join(',')).join('\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='bizviora-founder-DEMO.csv';a.click();URL.revokeObjectURL(url);toast('Đã xuất CSV mẫu; không có số liệu kinh doanh thật');return}if(action==='alerts'){modal('Thông báo Founder — DEMO',`Có 6 thông báo minh họa. Dữ liệu trạng thái của sản phẩm thật phải kiểm tra từ nguồn chính thức.`,[{label:'Xem phê duyệt',action:'goto-approvals'}]);return}if(action==='goto-approvals'){S.route='approvals';render();return}if(action==='help'){modal('Founder Control Center',`Đây là bản dựng theo infographic BIZVIORA. Chọn menu để điều hướng; thử chọn tenant, lọc danh sách, xem Kanban và module. Tất cả là dữ liệu mẫu, không có API hay đăng nhập thật.`);return}if(action==='confirm-approve'||action==='confirm-reject'){const a=approvals.find(a=>a.id===el.dataset.ref);if(!a)return; a.status=action==='confirm-approve'?'approved':'rejected';render();toast(`Cập nhật ${a.id} trong bộ nhớ DEMO — KHÔNG CÓ HIỆU LỰC THẬT`);return}if(action==='choose-period'||action==='period-change'){modal('Khoảng thời gian',`Các biểu đồ đang dùng bộ số liệu DEMO cố định, không phải nguồn thống kê cập nhật.`,[{label:'7 ngày mẫu',action:'period-7'},{label:'30 ngày mẫu',action:'period-30'}]);return}if(action.startsWith('period-')){S.period=action.split('-')[1];render();return}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-nav],[data-tenant],[data-tenant-tab],[data-module],[data-deploy],[data-deploy-detail],[data-task],[data-approval],[data-flag],[data-action],#choose-period');if(!target)return;if(target.dataset.nav){S.route=target.dataset.nav;render();return}if(target.dataset.tenant!==undefined){S.selectedTenant=+target.dataset.tenant;S.tenantTab='Tổng quan';S.route=S.route==='overview'?'tenants':S.route;render();return}if(target.dataset.tenantTab){S.tenantTab=target.dataset.tenantTab;render();return}if(target.dataset.deploy!==undefined){S.selectedDeploy=+target.dataset.deploy;S.deployDetailTab='Checklist';render();return}if(target.dataset.deployDetail){S.deployDetailTab=target.dataset.deployDetail;render();return}if(target.dataset.flag){const m=modules.find(m=>m.id===target.dataset.flag);m.flag=!m.flag;render();toast('Chỉ đổi feature flag trên giao diện DEMO');return}if(target.dataset.module){let m=modules.find(m=>m.id===target.dataset.module);modal('Module '+m.name,`Phiên bản mẫu <b>${m.version}</b>, trạng thái <b>${m.status}</b>. Triển khai thật và cấp gói cần phê duyệt riêng.`);return}if(target.dataset.task){const t=tasks.find(x=>x.id===target.dataset.task);modal('Thay trạng thái công việc mẫu',`<b>${esc(t.title)}</b><br>Chọn tiếp để chuyển sang <b>${taskStages[(t.stage+1)%4]}</b> trong bộ nhớ DEMO.`,[{label:'Xác nhận DEMO',action:'task-next',id:t.id}]);return}if(target.dataset.approval){const a=approvals.find(x=>x.id===target.dataset.approval);modal('Duyệt mô phỏng '+a.id,`<b>${esc(a.title)}</b><br>Cấp quyền ${a.level}; tình trạng <b>${a.status}</b>. Việc bấm xác nhận không được coi là quyết định có hiệu lực; không gọi API, không thay đổi quyền/dữ liệu thật.`,[{label:'Từ chối DEMO',action:'confirm-reject',id:a.id,class:'outline'},{label:'Duyệt DEMO',action:'confirm-approve',id:a.id}]);return}if(target.dataset.action==='task-next'){const t=tasks.find(x=>x.id===target.dataset.ref);t.stage=(t.stage+1)%4;render();toast('Đã chuyển trạng thái công việc RAM (DEMO)');return}if(target.id==='choose-period'){act('choose-period',target);return}if(target.dataset.action){act(target.dataset.action,target);return}});
