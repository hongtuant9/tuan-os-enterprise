name: TCE OVH Production Watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tce-vps-watchdog.yml"
      - "start.mjs"
      - "src/app/health/route.ts"
      - "src/app/api/internal/tce/**"
      - "src/app/api/internal/cmi/**"
      - "src/server/agents/tce-orchestrator.ts"
      - "src/server/agents/execution-governance.ts"
      - "src/server/channels/channel-policy.ts"
      - "scripts/ovh/**"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  ovh-production-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Probe OVH runtime directly
        shell: bash
        run: |
          set -euo pipefail
          HOST="app.tamcocexperience.com"
          OVH_IP="57.128.186.45"
          HTTP_URL="http://${HOST}/health"
          rm -f /tmp/health.json /tmp/direct_http_code /tmp/public_https_code /tmp/dns_ip

          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sS --connect-timeout 8 --max-time 20               --resolve "${HOST}:80:${OVH_IP}"               -o /tmp/health.json -w '%{http_code}' "$HTTP_URL" || true)"
            echo "$code" > /tmp/direct_http_code
            if [ "$code" = "200" ] && python3 -m json.tool /tmp/health.json >/dev/null 2>&1; then
              echo "OVH direct runtime reachable on attempt $attempt"
              break
            fi
            echo "Attempt $attempt: OVH runtime not ready, HTTP ${code:-000}"
            if [ "$attempt" = "6" ]; then
              echo "OVH direct runtime acceptance failed"
              exit 1
            fi
            sleep 12
          done

      - name: Validate autonomous-company invariants
        shell: python
        run: |
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/health.json").read_text())
          errors = []

          def expect(cond, message):
              if not cond:
                  errors.append(message)

          expect(data.get("status") == "ok", f"status={data.get('status')!r}")
          checks = data.get("checks") or {}
          expect(checks.get("app") == "ok", f"checks.app={checks.get('app')!r}")
          expect(checks.get("database") == "ok", f"checks.database={checks.get('database')!r}")
          expect(int(data.get("agentRegistry") or 0) >= 16, f"agentRegistry={data.get('agentRegistry')!r}")
          expect(int(data.get("executiveOrgRoles") or 0) >= 11, f"executiveOrgRoles={data.get('executiveOrgRoles')!r}")

          features = data.get("features") or {}
          expect(features.get("companyAutopilot") == "v1",
                 f"companyAutopilot={features.get('companyAutopilot')!r}")
          expect(features.get("businessOperatingPlan") == "2026-2027-v1",
                 f"businessOperatingPlan={features.get('businessOperatingPlan')!r}")

          signals = data.get("runtimeSignals") or {}
          expect(signals.get("companyAutopilotEnabled") is True,
                 f"companyAutopilotEnabled={signals.get('companyAutopilotEnabled')!r}")
          expect(signals.get("companyRuntimeMode") == "VPS_ALWAYS_ON",
                 f"companyRuntimeMode={signals.get('companyRuntimeMode')!r}")
          expect(signals.get("runtimeDependencyPolicy") == "VPS_ONLY",
                 f"runtimeDependencyPolicy={signals.get('runtimeDependencyPolicy')!r}")
          expect(signals.get("windowDependency") is False,
                 f"windowDependency={signals.get('windowDependency')!r}")
          expect(signals.get("desktopDependency") is False,
                 f"desktopDependency={signals.get('desktopDependency')!r}")
          expect(signals.get("desktopRuntimeRole") == "NON_RUNTIME_FALLBACK_ONLY",
                 f"desktopRuntimeRole={signals.get('desktopRuntimeRole')!r}")
          expect(signals.get("chatWindowRole") == "STATELESS_CONTROL_SURFACE_ONLY",
                 f"chatWindowRole={signals.get('chatWindowRole')!r}")
          expect(signals.get("executiveWorkerEnabled") is True,
                 f"executiveWorkerEnabled={signals.get('executiveWorkerEnabled')!r}")
          expect(signals.get("syncWorkerEnabled") is True,
                 f"syncWorkerEnabled={signals.get('syncWorkerEnabled')!r}")
          expect(signals.get("staffOpsWorkerEnabled") is True,
                 f"staffOpsWorkerEnabled={signals.get('staffOpsWorkerEnabled')!r}")
          expect(signals.get("cmiBrowserEnabled") is True,
                 f"cmiBrowserEnabled={signals.get('cmiBrowserEnabled')!r}")
          expect(signals.get("vpsHeadlessBrowserEnabled") is True,
                 f"vpsHeadlessBrowserEnabled={signals.get('vpsHeadlessBrowserEnabled')!r}")
          expect(signals.get("browserRuntimeMode") in ("VPS_HEADLESS_PUBLIC_ONLY", "VPS_HEADLESS_PLUS_AUTHENTICATED"),
                 f"browserRuntimeMode={signals.get('browserRuntimeMode')!r}")
          expect(signals.get("cmiQueueWorkerEnabled") is True,
                 f"cmiQueueWorkerEnabled={signals.get('cmiQueueWorkerEnabled')!r}")
          expect(signals.get("omnichannelWorkerEnabled") is True,
                 f"omnichannelWorkerEnabled={signals.get('omnichannelWorkerEnabled')!r}")
          expect(signals.get("trelloWorkerEnabled") is True,
                 f"trelloWorkerEnabled={signals.get('trelloWorkerEnabled')!r}")
          expect(signals.get("executionGovernanceVersion") == "2026-09-26.v5",
                 f"executionGovernanceVersion={signals.get('executionGovernanceVersion')!r}")
          expect(signals.get("trelloExecutionMirror") in ("ACTIVE", "HOLD_NO_RUNTIME_CREDENTIALS"),
                 f"trelloExecutionMirror={signals.get('trelloExecutionMirror')!r}")
          expect(signals.get("kiotVietWriteEnabled") is False,
                 f"kiotVietWriteEnabled={signals.get('kiotVietWriteEnabled')!r}")
          expect(signals.get("directBookingAutoCreateEnabled") is False,
                 f"directBookingAutoCreateEnabled={signals.get('directBookingAutoCreateEnabled')!r}")

          open_channels = signals.get("openCustomerChannels") or []
          expect("facebook" in open_channels,
                 f"facebook missing from openCustomerChannels={open_channels!r}")

          matrix = {item.get("id"): item for item in (signals.get("omnichannelChannels") or [])}
          for channel_id in open_channels:
              channel = matrix.get(channel_id)
              expect(channel is not None, f"missing omnichannel matrix entry for {channel_id!r}")
              if not channel:
                  continue
              expect(channel.get("readiness") != "UNAVAILABLE_PROVIDER",
                     f"{channel_id} provider is unavailable")
              expect(channel.get("providerConfig") in ("CONFIGURED", "NOT_REQUIRED"),
                     f"{channel_id} providerConfig={channel.get('providerConfig')!r}")
              if signals.get("pilotOutboundEnabled") is True and channel.get("transport") != "api_bridge":
                  expect(channel.get("providerVerification") == "VERIFIED_PILOT",
                         f"{channel_id} outbound requires VERIFIED_PILOT, got {channel.get('providerVerification')!r}")

          if errors:
              print("WATCHDOG FAIL")
              for item in errors:
                  print(f"- {item}")
              raise SystemExit(1)

          print("WATCHDOG OVH RUNTIME PASS")

      - name: Check Tenten DNS and public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          HOST="app.tamcocexperience.com"
          OVH_IP="57.128.186.45"
          resolved="$(getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u | tr '\n' ' ')"
          printf '%s\n' "$resolved" > /tmp/dns_ip
          public_code="$(curl -sS --connect-timeout 8 --max-time 20             -o /tmp/public-health.json -w '%{http_code}'             "https://${HOST}/health" || true)"
          echo "$public_code" > /tmp/public_https_code

          if ! printf '%s' "$resolved" | grep -qw "$OVH_IP"; then
            echo "CUTOVER_PENDING" > /tmp/cutover_state
            echo "DNS CUTOVER PENDING: $HOST is not yet on OVH $OVH_IP"
            exit 0
          fi

          echo "CUTOVER_ACTIVE" > /tmp/cutover_state

          if [ "$public_code" != "200" ] || ! python3 -m json.tool /tmp/public-health.json >/dev/null 2>&1; then
            echo "PUBLIC HTTPS FAIL after DNS cutover: HTTP ${public_code:-000}"
            exit 1
          fi

          echo "PUBLIC CUTOVER PASS"

      - name: Write sanitized summary
        if: always()
        shell: bash
        run: |
          {
            echo "## TCE OVH-only Watchdog"
            echo
            echo "- Checked: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Production target: OVH 57.128.186.45"
            echo "- DNS authority: Tenten"
            echo "- Hostinger: SUPERSEDED"
            echo "- Job status: ${{ job.status }}"
            if [ -f /tmp/direct_http_code ]; then echo "- OVH direct HTTP: $(cat /tmp/direct_http_code)"; fi
            if [ -f /tmp/dns_ip ]; then echo "- Public DNS A: $(cat /tmp/dns_ip)"; fi
            if [ -f /tmp/public_https_code ]; then echo "- Public HTTPS: $(cat /tmp/public_https_code)"; fi
            if [ -f /tmp/cutover_state ]; then echo "- Cutover state: $(cat /tmp/cutover_state)"; fi
            echo "- Desktop dependency: none"
            echo "- No secrets are read or printed."
          } >> "$GITHUB_STEP_SUMMARY"
